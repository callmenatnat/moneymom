<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Mom V7.5</title><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.08)}.hero{background:linear-gradient(135deg,#16a34a,#2563eb);color:#fff}.big{font-size:32px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.chip{padding:12px;border:none;border-radius:12px}.row{display:flex;gap:8px}.bar{height:20px;background:#e5e7eb;border-radius:999px;overflow:hidden}.fill{height:100%;background:#2563eb}.elder *{font-size:22px!important}</style></head><body><div class="card hero"><h2>💰 Money Mom V7.5</h2><label><input type="checkbox" id="elder"> 👵 โหมดผู้สูงอายุ</label></div><div class='card'><div>เงินคงเหลือ</div><div id='bal' class='big'>0 บาท</div><div>หนี้บัตรเครดิต: <span id='debt'>0</span> บาท</div></div><div class='card'><h3>💵 รายรับ</h3><div class='grid'><button class='chip' onclick="quickIncome('เงินเดือน')">💵 เงินเดือน</button><button class='chip' onclick="quickIncome('โอนเข้า')">💸 โอนเข้า</button><button class='chip' onclick="quickIncome('ขายของ')">🛍️ ขายของ</button></div></div><div class='card'><h3>🍚 รายจ่าย</h3><div class='grid'><button class='chip' onclick="quickExpense('ค่ากับข้าว')">🍚</button><button class='chip' onclick="quickExpense('ค่าน้ำมัน')">🚗</button><button class='chip' onclick="quickExpense('ค่าไฟ')">💡</button><button class='chip' onclick="quickExpense('ค่ายา')">💊</button><button class='chip' onclick="quickExpense('ซื้อของ')">🛒</button><button class='chip' onclick="quickExpense('ค่าโทรศัพท์')">📱</button></div></div><div class='card'><select id='type'><option value='income'>รายรับ</option><option value='expense'>รายจ่าย</option><option value='credit'>รูดบัตร</option><option value='paycredit'>จ่ายบัตร</option></select><input id='cat' placeholder='รายการ'><input id='date' type='date'><div class='row'><button onclick='today()'>วันนี้</button><button onclick='yesterday()'>เมื่อวาน</button><button onclick='day3()'>3 วันก่อน</button></div><input id='amount' type='number' placeholder='จำนวนเงิน'><select id='card'><option>KTC</option><option>SCB</option><option>KBank</option><option>Krungsri</option></select><button onclick='addTx()'>บันทึก</button></div><div class='card'><h3>🎯 งบประมาณ</h3><input id='budget' type='number' value='30000'><div id='budgetTxt'></div></div><div class='card'><h3>📈 รายรับเทียบรายจ่าย</h3><div id='compare'></div></div><div class='card'><h3>📊 รายจ่าย 6 เดือน</h3><div id='months'></div></div><div class='card'><h3>📅 สรุปรายวัน</h3><div id='daily'></div></div><div class='card'><h3>🔍 ค้นหา</h3><input id='search'><div id='results'></div></div><div class='card'><button onclick='backup()'>Export JSON</button><input type='file' id='restore'></div><script>let db=JSON.parse(localStorage.getItem('mm75')||'[]');date.value=new Date().toISOString().slice(0,10);elder.onchange=()=>document.body.classList.toggle('elder',elder.checked);function quickIncome(v){type.value='income';cat.value=v}function quickExpense(v){type.value='expense';cat.value=v}function today(){date.value=new Date().toISOString().slice(0,10)}function yesterday(){let d=new Date();d.setDate(d.getDate()-1);date.value=d.toISOString().slice(0,10)}function day3(){let d=new Date();d.setDate(d.getDate()-3);date.value=d.toISOString().slice(0,10)}function addTx(){let a=+amount.value;if(a<=0)return;db.push({id:Date.now(),type:type.value,cat:cat.value,amount:a,date:date.value,card:card.value});localStorage.setItem('mm75',JSON.stringify(db));render()}function backup(){let b=new Blob([JSON.stringify(db)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MoneyMomV75.json';a.click()}restore.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);localStorage.setItem('mm75',r.result);render()};r.readAsText(f)};search.oninput=render;function render(){let bal=0,debtv=0,inc=0,exp=0,days={};db.forEach(x=>{if(x.type==='income'){bal+=x.amount;inc+=x.amount}else if(x.type==='expense'){bal-=x.amount;exp+=x.amount}else if(x.type==='credit'){debtv+=x.amount}else if(x.type==='paycredit'){debtv-=x.amount;bal-=x.amount}days[x.date]=days[x.date]||[];days[x.date].push(x)});document.getElementById('bal').textContent=bal.toLocaleString()+' บาท';document.getElementById('debt').textContent=debtv.toLocaleString();budgetTxt.textContent='ใช้ '+exp.toLocaleString()+' จาก '+(+budget.value).toLocaleString()+' บาท';let m=Math.max(inc,exp,1);compare.innerHTML='🟢 รายรับ '+inc.toLocaleString()+'<div class=bar><div class=fill style="width:'+(inc/m*100)+'%"></div></div><br>🔴 รายจ่าย '+exp.toLocaleString()+'<div class=bar><div class=fill style="background:#ef4444;width:'+(exp/m*100)+'%"></div></div>';daily.innerHTML=Object.keys(days).sort().reverse().map(d=>'<div><b>'+d+'</b> รวม '+days[d].reduce((s,i)=>s+((i.type==='expense')?i.amount:0),0).toLocaleString()+' บาท</div>').join('');let q=(search.value||'').toLowerCase();results.innerHTML=db.filter(x=>!q||x.cat.toLowerCase().includes(q)).slice().reverse().map(x=>x.date+' • '+x.cat+' • '+x.amount+' <button onclick="del('+x.id+')">ลบ</button>').join('<br>');let arr=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let k=d.toISOString().slice(0,7),t=0;db.forEach(x=>{if(x.type==='expense'&&x.date.startsWith(k))t+=x.amount});arr.push([k,t])}let mx=Math.max(1,...arr.map(a=>a[1]));months.innerHTML=arr.map(a=>a[0]+' '+a[1].toLocaleString()+'<div class=bar><div class=fill style="width:'+(a[1]/mx*100)+'%"></div></div>').join('')}function del(id){db=db.filter(x=>x.id!==id);localStorage.setItem('mm75',JSON.stringify(db));render()}render();</script></body></html>
