<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Mom V7.1</title><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;padding:12px}.card{background:#fff;padding:14px;border-radius:16px;margin:10px 0}input,select,button{width:100%;padding:12px;margin:4px 0;border-radius:10px}.row{display:flex;gap:8px}.big{font-size:28px;font-weight:bold}</style></head><body><h1>💰 Money Mom V7.1</h1><div class=card><div>คงเหลือ</div><div id=bal class=big>0 บาท</div></div><div class=card><select id=type><option value=income>รายรับ</option><option value=expense>รายจ่าย</option><option value=credit>รูดบัตร</option><option value=paycredit>จ่ายบัตร</option></select><input id=cat placeholder='รายการ'><input id=txDate type='date'><div class=row><button type='button' onclick='setToday()'>📅 วันนี้</button><button type='button' onclick='setYesterday()'>📅 เมื่อวาน</button></div><input id=amount type='number' placeholder='จำนวนเงิน'><button onclick='addTx()'>บันทึก</button></div><div class=card><h3>📅 สรุปรายวัน</h3><div id=daily></div></div><div class=card><h3>🔍 ค้นหา</h3><input id=search oninput='render()' placeholder='ค้นหารายการ'><div id=results></div></div><script>let db=JSON.parse(localStorage.getItem('mmv71')||'[]');function setToday(){txDate.value=new Date().toISOString().slice(0,10)}function setYesterday(){let d=new Date();d.setDate(d.getDate()-1);txDate.value=d.toISOString().slice(0,10)}setToday();function addTx(){let a=+amount.value;if(a<=0)return;db.push({type:type.value,cat:cat.value||'รายการ',amount:a,date:txDate.value+'T12:00:00'});localStorage.setItem('mmv71',JSON.stringify(db));cat.value='';amount.value='';setToday();render()}function render(){let bal=0,days={};db.forEach(x=>{bal+=x.type==='income'?x.amount:-x.amount;let d=x.date.slice(0,10);(days[d]??=[]).push(x)});bal.textContent=bal.toLocaleString()+' บาท';daily.innerHTML=Object.keys(days).sort().reverse().map(d=>'<div><b>'+d+'</b> รวม '+days[d].reduce((s,i)=>s+(i.type==='expense'?i.amount:0),0).toLocaleString()+' บาท</div>').join('');let q=search.value?.toLowerCase()||'';results.innerHTML=db.filter(x=>!q||x.cat.toLowerCase().includes(q)).slice().reverse().map(x=>x.date.slice(0,10)+' • '+x.cat+' • '+x.amount.toLocaleString()+' บาท').join('<br>')}render();</script></body></html>
