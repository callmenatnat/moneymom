<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Mom V6</title><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;margin:0;padding:12px} .card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)} .hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.num{font-size:32px;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px} input,select,button{width:100%;padding:14px;font-size:18px;border-radius:12px;box-sizing:border-box;margin:4px 0} button{border:none;background:#2563eb;color:#fff}.bar{height:24px;background:#e5e7eb;border-radius:999px;overflow:hidden}.fill{height:100%;background:#2563eb}.warn{background:#fef3c7;padding:10px;border-radius:10px} table{width:100%;font-size:14px} td{padding:4px}</style></head><body><div class="card hero"><h2>💰 Money Mom V6</h2><div>จัดการรายรับ รายจ่าย และบัตรเครดิต</div></div><div class='card'><div>เงินคงเหลือ</div><div id='bal' class='num'>0</div><div>หนี้บัตรเครดิต</div><div id='debt' class='num'>0</div></div><div class='card'><input type='month' id='month'><input id='budget' type='number' placeholder='งบประมาณรายเดือน'><div id='budgetInfo'></div></div><div class='card'><select id='type'><option value='income'>รายรับ</option><option value='expense'>รายจ่าย</option><option value='credit'>รูดบัตรเครดิต</option><option value='paycredit'>จ่ายบัตรเครดิต</option></select><input id='cat' placeholder='หมวด เช่น ค่าอาหาร'><input id='amount' type='number' placeholder='จำนวนเงิน'><select id='card'><option>KTC</option><option>SCB</option><option>KBank</option><option>Krungsri</option></select><button onclick='addTx()'>บันทึก</button></div><div class='card'><h3>📊 กราฟรายจ่าย</h3><div id='chart'></div></div><div class='card'><h3>💳 บัตรเครดิต</h3><div id='cards'></div></div><div class='card'><h3>📈 ย้อนหลัง 6 เดือน</h3><div id='history'></div></div><div class='card'><h3>📋 รายการล่าสุด</h3><div id='recent'></div></div><div class='card row'><button onclick='backup()'>Export Backup</button><button onclick='document.getElementById("restore").click()'>Import Backup</button><input id='restore' type='file' hidden></div><script>let db=JSON.parse(localStorage.getItem('momv6')||'[]');month.value=new Date().toISOString().slice(0,7);budget.value=localStorage.getItem('momv6_budget')||30000;budget.onchange=()=>{localStorage.setItem('momv6_budget',budget.value);render()};restore.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);localStorage.setItem('momv6',JSON.stringify(db));render()};r.readAsText(f)};month.onchange=render;function addTx(){const a=+amount.value;if(a<=0)return alert('กรอกจำนวนเงิน');db.push({type:type.value,cat:cat.value||'อื่นๆ',amount:a,card:card.value,date:new Date().toISOString()});localStorage.setItem('momv6',JSON.stringify(db));cat.value='';amount.value='';render()}function backup(){const blob=new Blob([JSON.stringify(db)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MoneyMomV6Backup.json';a.click()}function render(){const m=month.value;let balv=0,debtv=0,exp=0;let cats={},cards={};recent.innerHTML='';db.filter(x=>x.date.startsWith(m)).forEach(x=>{if(x.type==='income') balv+=x.amount; if(x.type==='expense'){balv-=x.amount;exp+=x.amount;cats[x.cat]=(cats[x.cat]||0)+x.amount;} if(x.type==='credit'){debtv+=x.amount;cards[x.card]=(cards[x.card]||0)+x.amount;} if(x.type==='paycredit'){debtv-=x.amount;balv-=x.amount;cards[x.card]=(cards[x.card]||0)-x.amount;}});bal.textContent=balv.toLocaleString()+' บาท'; debt.textContent=debtv.toLocaleString()+' บาท'; let max=Math.max(1,...Object.values(cats)); chart.innerHTML=Object.entries(cats).map(([k,v])=>`<div>${k} (${v.toLocaleString()} บาท)</div><div class='bar'><div class='fill' style='width:${v/max*100}%'></div></div>`).join('')||'ยังไม่มีข้อมูล'; cards.innerHTML=Object.entries(cards).map(([k,v])=>`<div>${k}: ${v.toLocaleString()} บาท</div>`).join('')||'ไม่มีข้อมูล'; let bg=+budget.value||0; let pct=bg?Math.round(exp/bg*100):0; budgetInfo.innerHTML=`ใช้ ${exp.toLocaleString()} / ${bg.toLocaleString()} บาท (${pct}%) ${pct>=80?"<div class=warn>⚠️ ใช้งบเกิน 80%</div>":''}`; let h=''; for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7);let total=0;db.forEach(x=>{if(x.date.startsWith(key)&&x.type==='expense') total+=x.amount});h+=key+' : '+total.toLocaleString()+' บาท<br>';} history.innerHTML=h; recent.innerHTML=db.slice(-20).reverse().map(x=>`${new Date(x.date).toLocaleDateString('th-TH')} • ${x.cat} • ${x.amount.toLocaleString()} บาท`).join('<br>');}render(); if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
