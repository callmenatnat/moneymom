<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Mom V7.3</title><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;padding:12px}.card{background:#fff;padding:14px;border-radius:16px;margin:10px 0}.big{font-size:28px;font-weight:bold}.row{display:flex;gap:8px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bar{height:22px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2563eb}</style></head><body><h1>💰 Money Mom V7.3</h1><div class=card><div>คงเหลือ</div><div id=bal class=big>0 บาท</div><div>หนี้บัตรเครดิต</div><div id=debt class=big>0 บาท</div></div><div class='card chips'><button onclick="quick('ค่ากับข้าว')">🍚</button><button onclick="quick('ค่าน้ำมัน')">🚗</button><button onclick="quick('ค่าไฟ')">💡</button><button onclick="quick('ค่ายา')">💊</button><button onclick="quick('ซื้อของ')">🛒</button></div><div class=card><select id=type><option value=income>รายรับ</option><option value=expense>รายจ่าย</option><option value=credit>รูดบัตร</option><option value=paycredit>จ่ายบัตร</option></select><input id=cat placeholder='รายการ'><input id=txDate type='date'><div class=row><button type='button' onclick='setToday()'>📅 วันนี้</button><button type='button' onclick='setYesterday()'>📅 เมื่อวาน</button></div><input id=amount type='number' placeholder='จำนวนเงิน'><button onclick='addTx()'>บันทึก</button></div><div class=card><h3>📊 รายจ่ายย้อนหลัง 6 เดือน</h3><div id='monthlyChart'></div></div><div class=card><h3>📅 สรุปรายวัน</h3><div id=daily></div></div><div class=card><h3>🔍 ค้นหา</h3><input id=search oninput='render()'><div id=results></div></div><script>let db=JSON.parse(localStorage.getItem('mmv73')||'[]');function quick(v){cat.value=v;type.value='expense'}function setToday(){txDate.value=new Date().toISOString().slice(0,10)}function setYesterday(){let d=new Date();d.setDate(d.getDate()-1);txDate.value=d.toISOString().slice(0,10)}setToday();function addTx(){let a=+amount.value;if(a<=0)return;db.push({type:type.value,cat:cat.value||'รายการ',amount:a,date:txDate.value+'T12:00:00'});localStorage.setItem('mmv73',JSON.stringify(db));cat.value='';amount.value='';render()}function render(){let balv=0,debtv=0,days={};db.forEach(x=>{if(x.type==='income')balv+=x.amount;else if(x.type==='expense')balv-=x.amount;else if(x.type==='credit')debtv+=x.amount;else if(x.type==='paycredit'){debtv-=x.amount;balv-=x.amount;}let d=x.date.slice(0,10);(days[d]??=[]).push(x)});bal.textContent=balv.toLocaleString()+' บาท';debt.textContent=debtv.toLocaleString()+' บาท';daily.innerHTML=Object.keys(days).sort().reverse().map(d=>'<div><b>'+d+'</b> รวม '+days[d].reduce((s,i)=>s+((i.type==='expense'||i.type==='paycredit')?i.amount:0),0).toLocaleString()+' บาท</div>').join('');let q=(search.value||'').toLowerCase();results.innerHTML=db.filter(x=>!q||x.cat.toLowerCase().includes(q)).slice().reverse().map(x=>x.date.slice(0,10)+' • '+x.cat+' • '+x.amount.toLocaleString()+' บาท').join('<br>');let m=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let key=d.toISOString().slice(0,7);let total=0;db.forEach(x=>{if(x.type==='expense'&&x.date.startsWith(key))total+=x.amount});m.push({key,total})}let max=Math.max(1,...m.map(x=>x.total));monthlyChart.innerHTML=m.map(x=>'<div>'+x.key+' '+x.total.toLocaleString()+' บาท</div><div class=bar><div class=fill style="width:'+(x.total/max*100)+'%"></div></div>').join('')}render();</script></body></html>
