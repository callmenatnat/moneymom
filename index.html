<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>Money Mom</title><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;margin:0;padding:16px} .card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.sum{font-size:30px;font-weight:700}.g{color:#16a34a}.b{color:#2563eb} input,select,button{width:100%;padding:14px;font-size:18px;margin:6px 0;border-radius:12px;border:1px solid #ccc;box-sizing:border-box}button{background:#2563eb;color:#fff;border:none} ul{padding-left:20px}</style></head><body><h1>💰 Money Mom</h1><div class=card><div>เงินคงเหลือ</div><div id=bal class="sum g">0</div><div>หนี้บัตรเครดิต</div><div id=debt class="sum b">0</div></div><div class=card><select id=type><option value=income>รายรับ</option><option value=expense>รายจ่าย</option><option value=credit>รูดบัตรเครดิต</option><option value=paycredit>จ่ายบัตรเครดิต</option></select><input id=desc placeholder='รายการ'><input id=amt type=number placeholder='จำนวนเงิน'><select id=card><option>KTC</option><option>SCB</option><option>KBank</option><option>Krungsri</option></select><button onclick='addTx()'>บันทึก</button><button onclick='backup()'>สำรองข้อมูล</button></div><div class=card><h3>รายการล่าสุด</h3><ul id=list></ul></div><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}let tx=JSON.parse(localStorage.getItem('moneymom')||'[]');function save(){localStorage.setItem('moneymom',JSON.stringify(tx))}function addTx(){let a=+amt.value;if(a<=0)return alert('กรอกจำนวนเงิน');tx.push({t:type.value,d:desc.value||'-',a:a,c:card.value,dt:new Date().toLocaleString('th-TH')});save();desc.value='';amt.value='';render()}function backup(){const blob=new Blob([JSON.stringify(tx)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moneymom-backup.json';a.click()}function render(){let bal=0,debt=0;list.innerHTML='';[...tx].reverse().forEach(x=>{if(x.t==='income')bal+=x.a;if(x.t==='expense')bal-=x.a;if(x.t==='credit')debt+=x.a;if(x.t==='paycredit'){debt-=x.a;bal-=x.a}const li=document.createElement('li');li.textContent=`${x.dt} • ${x.d} • ${x.a.toLocaleString()} บาท`;list.appendChild(li)});bal.textContent=bal.toLocaleString?bal.toLocaleString():bal;document.getElementById('bal').textContent=Number(bal).toLocaleString()+' บาท';document.getElementById('debt').textContent=Number(debt).toLocaleString()+' บาท';}render();</script></body></html>
