<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Mom V7 Complete</title><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><style>body{font-family:-apple-system,sans-serif;background:#f3f4f6;margin:0;padding:12px}.card{background:#fff;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}.hero{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff}.num{font-size:30px;font-weight:700}input,select,button{width:100%;padding:12px;font-size:18px;margin:4px 0;border-radius:12px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:none}.bar{height:22px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb}.day{border-top:1px solid #eee;padding:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body><div class="card hero"><h2>💰 Money Mom V7 Complete</h2><div>รายรับ รายจ่าย บัตรเครดิต รายวัน รายเดือน</div></div><div class='card'><div>เงินคงเหลือ</div><div id='bal' class='num'>0 บาท</div><div>หนี้บัตรเครดิต</div><div id='debt' class='num'>0 บาท</div></div><div class='card'><input type='month' id='month'><input type='number' id='budget' placeholder='งบประมาณรายเดือน'></div><div class='card'><select id='type'><option value='income'>รายรับ</option><option value='expense'>รายจ่าย</option><option value='credit'>รูดบัตร</option><option value='paycredit'>จ่ายบัตร</option></select><input id='cat' placeholder='หมวด'><input id='amount' type='number' placeholder='จำนวนเงิน'><select id='card'><option>KTC</option><option>SCB</option><option>KBank</option><option>Krungsri</option></select><button onclick='addTx()'>บันทึก</button></div><div class='card'><h3>🎯 งบประมาณ</h3><div id='budgetInfo'></div></div><div class='card'><h3>📊 กราฟรายจ่ายตามหมวด</h3><div id='chart'></div></div><div class='card'><h3>📅 สรุปรายวัน</h3><div id='daily'></div></div><div class='card'><h3>💳 บัตรเครดิต</h3><div id='cards'></div></div><div class='card'><h3>📈 ย้อนหลัง 6 เดือน</h3><div id='history'></div></div><div class='card'><input id='search' placeholder='ค้นหารายการ'><div id='results'></div></div><div class='card grid'><button onclick='backup()'>Export Backup</button><button onclick='document.getElementById("restore").click()'>Import Backup</button><input id='restore' type='file' hidden></div><script>let db=JSON.parse(localStorage.getItem('mmv7')||'[]');month.value=new Date().toISOString().slice(0,7);budget.value=localStorage.getItem('mmv7_budget')||30000;budget.onchange=()=>{localStorage.setItem('mmv7_budget',budget.value);render()};search.oninput=render;restore.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);localStorage.setItem('mmv7',JSON.stringify(db));render()};r.readAsText(f)};function addTx(){let a=+amount.value;if(a<=0)return;db.push({type:type.value,cat:cat.value||'อื่นๆ',amount:a,card:card.value,date:new Date().toISOString()});localStorage.setItem('mmv7',JSON.stringify(db));cat.value='';amount.value='';render()}function backup(){let b=new Blob([JSON.stringify(db)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MoneyMomV7Backup.json';a.click()}function render(){let m=month.value,bal=0,debt=0,exp=0,cats={},cardsObj={},days={};db.filter(x=>x.date.startsWith(m)).forEach(x=>{let day=x.date.slice(0,10);days[day]=days[day]||[];days[day].push(x);if(x.type==='income')bal+=x.amount;if(x.type==='expense'){bal-=x.amount;exp+=x.amount;cats[x.cat]=(cats[x.cat]||0)+x.amount}if(x.type==='credit'){debt+=x.amount;cardsObj[x.card]=(cardsObj[x.card]||0)+x.amount}if(x.type==='paycredit'){debt-=x.amount;bal-=x.amount;cardsObj[x.card]=(cardsObj[x.card]||0)-x.amount}});document.getElementById('bal').textContent=bal.toLocaleString()+' บาท';document.getElementById('debt').textContent=debt.toLocaleString()+' บาท';let bg=+budget.value||0,p=bg?Math.round(exp/bg*100):0;budgetInfo.innerHTML='ใช้ '+exp.toLocaleString()+' / '+bg.toLocaleString()+' บาท ('+p+'%)';let max=Math.max(1,...Object.values(cats),1);chart.innerHTML=Object.entries(cats).map(([k,v])=>'<div>'+k+' '+v.toLocaleString()+'</div><div class=bar><div class=fill style="width:'+(v/max*100)+'%"></div></div>').join('');daily.innerHTML=Object.keys(days).sort().reverse().map(d=>'<div class=day><b>'+d+'</b><br>รวม '+days[d].filter(i=>i.type==="expense").reduce((a,b)=>a+b.amount,0).toLocaleString()+' บาท</div>').join('');cards.innerHTML=Object.entries(cardsObj).map(([k,v])=>k+': '+v.toLocaleString()+' บาท').join('<br>');let h='';for(let i=5;i>=0;i--){let dt=new Date();dt.setMonth(dt.getMonth()-i);let key=dt.toISOString().slice(0,7);let s=0;db.forEach(x=>{if(x.date.startsWith(key)&&x.type==='expense')s+=x.amount});h+=key+' : '+s.toLocaleString()+' บาท<br>'}history.innerHTML=h;let q=search.value.toLowerCase();results.innerHTML=db.filter(x=>!q||x.cat.toLowerCase().includes(q)).slice().reverse().slice(0,30).map(x=>x.date.slice(0,10)+' • '+x.cat+' • '+x.amount.toLocaleString()+' บาท').join('<br>')}render();if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script></body></html>
